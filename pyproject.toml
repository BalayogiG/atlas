[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Minimal, extensible tabular data-quality evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "typer>=0.9",
  "openpyxl>=3.1",
  "pyarrow>=12",
  "rich>=13",
]

[project.optional-dependencies]
reasoning = ["ollama>=0.3"]

[project.scripts]
atlas = "atlas.cli:app"

[tool.setuptools.packages.find]
include = ["atlas*"]
